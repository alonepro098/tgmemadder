{% extends "base.html" %}

{% block title %}Admin Login - TG Member Adder{% endblock %}

{% block content %}
<div style="width: 100%; max-width: 400px; margin: auto;">
    <div class="glass-card" style="padding: 2.5rem; text-align: center;">
        <h2 style="font-size: 1.75rem; font-weight: 700; margin-bottom: 0.5rem; background: var(--primary-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">
            TG MemAdder
        </h2>
        <p style="color: var(--text-muted); margin-bottom: 2rem; font-size: 0.9rem;">Sign in to access the control panel</p>
        
        <form method="POST" action="{{ url_for('admin.login') }}">
            <div class="form-group" style="text-align: left;">
                <label class="form-label">Username</label>
                <input type="text" name="username" class="form-control" placeholder="admin" required autofocus>
            </div>
            <div class="form-group" style="text-align: left;">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; margin-top: 1rem; padding: 0.8rem;">
                Sign In 🚀
            </button>
        </form>
    </div>
</div>
{% endblock %}
